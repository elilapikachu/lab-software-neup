<div class="alert-container">
  @for (alert of alerts$ | async; track alert.id) {
    <div
      class="alert alert-{{ alert.type }} alert-custom"
      [class.alert-dismissible]="alert.dismissible"
      role="alert">
      <span class="alert-icon">{{ iconFor(alert.type) }}</span>
      {{ alert.message }}

      @if (alert.dismissible) {
        <button
          type="button"
          class="btn-close"
          (click)="dismiss(alert)"
          aria-label="Cerrar"
        ></button>
      }
    </div>
  }
</div>
